services:
  # ─── MySQL 数据库 ──────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: seitem-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: seitem
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Neo4j 图数据库 ────────────────────────────────────────
  neo4j:
    image: neo4j:5.12-community
    container_name: seitem-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/neo4j123
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "17474:7474"
      - "17687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── 应用服务 ──────────────────────────────────────────────
  # 使用 host 网络以解决 Docker 内 DNS 解析问题
  app:
    build:
      context: .
      network: host
    container_name: seitem-app
    network_mode: host
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      # host 网络模式下，通过 localhost + 映射端口连接数据库
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "13306"
      MYSQL_USER: root
      MYSQL_PASSWORD: root123
      MYSQL_DATABASE: seitem
      NEO4J_URI: bolt://127.0.0.1:17687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j123
      BAIDU_APP_ID: ${BAIDU_APP_ID:-}
      BAIDU_SECRET_KEY: ${BAIDU_SECRET_KEY:-}
    volumes:
      - ./data:/app/data
      - ./images:/app/images
    command: ["--step", "all"]

volumes:
  mysql_data:
  neo4j_data:
